<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳號安全回復服務 - 官方系統驗證</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            background-color: #ffffff;
            color: #1d1d1f;
        }

        /* 視窗彈出動畫 */
        .popup-anim {
            animation: popIn 0.08s ease-out forwards;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        }

        @keyframes popIn {
            0% { transform: scale(0.2); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 全螢幕震動特效 */
        .shake-light {
            animation: shake 0.1s infinite;
        }
        .shake-heavy {
            animation: shake 0.04s infinite;
        }

        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-4px, 4px) rotate(-1deg); }
            50% { transform: translate(4px, -4px) rotate(1deg); }
            75% { transform: translate(-4px, -4px); }
            100% { transform: translate(4px, 4px); }
        }

        /* 螢幕過熱紅光脈衝 */
        .overheat-bg {
            animation: overheat 0.25s infinite alternate;
        }

        @keyframes overheat {
            0% { background-color: rgba(140, 0, 0, 0.5); }
            100% { background-color: rgba(255, 0, 0, 0.95); }
        }

        /* 逼真螢幕五彩損壞條紋 (置頂並持續閃爍) */
        .glitch-lines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100; /* 提升至最上層，確保全程覆蓋 */
            background: linear-gradient(90deg, 
                transparent 0%,
                transparent 15%,
                rgba(255, 255, 255, 0.95) 15.5%,
                rgba(255, 255, 255, 0.95) 16.5%,
                transparent 17%,
                rgba(0, 255, 120, 0.9) 22%,
                rgba(0, 255, 120, 0.9) 23.5%,
                rgba(255, 0, 150, 0.85) 24%,
                rgba(0, 255, 200, 0.95) 25%,
                rgba(255, 255, 255, 0.98) 26%,
                rgba(255, 255, 255, 0.98) 32%,
                rgba(0, 255, 120, 0.9) 33%,
                rgba(0, 255, 120, 0.9) 36%,
                transparent 37%,
                rgba(0, 255, 200, 0.9) 45%,
                rgba(255, 0, 180, 0.85) 46%,
                rgba(255, 255, 255, 0.95) 47%,
                rgba(0, 255, 120, 0.9) 52%,
                rgba(255, 255, 255, 0.98) 55%,
                rgba(255, 255, 255, 0.98) 60%,
                transparent 61%,
                rgba(255, 0, 120, 0.9) 70%,
                rgba(0, 255, 150, 0.95) 71%,
                rgba(255, 255, 255, 0.9) 72%,
                transparent 73%
            );
            mix-blend-mode: screen;
            animation: flicker 0.08s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 0.85; transform: scaleX(1); }
            50% { opacity: 1; transform: scaleX(1.002); }
            100% { opacity: 0.9; transform: scaleX(0.998); }
        }

        /* 爆炸白閃光 */
        .explosion-flash {
            animation: flash 0.35s ease-out forwards;
        }

        @keyframes flash {
            0% { background-color: #ffffff; opacity: 1; }
            100% { background-color: #000000; opacity: 1; }
        }
    </style>
</head>
<body id="mainBody" class="h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- 第一階段：乾淨、白色官方感的帳號回復頁面 -->
    <div id="startScreen" class="z-50 flex flex-col items-center justify-center w-full h-full bg-white text-slate-800 p-6">
        <div class="max-w-md w-full text-center space-y-6">
            <!-- 官方風格圖示 -->
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto shadow-sm">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
            </div>
            
            <div class="space-y-2">
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">帳號安全回復驗證</h1>
                <p class="text-sm text-slate-500">系統檢測到您的裝置需要進行安全性確認。請點擊下方按鈕以啟動自動修復與帳號資料同步。</p>
            </div>

            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-left text-xs text-slate-600 space-y-1">
                <div class="flex justify-between">
                    <span class="text-slate-400">裝置類型:</span>
                    <span class="font-medium">Mobile Client Device</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">安全狀態:</span>
                    <span class="font-medium text-emerald-600">等待驗證中</span>
                </div>
            </div>

            <button onclick="startEffect()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-xl transition-all shadow-lg shadow-blue-500/20 active:scale-95">
                開始安全性帳號回復
            </button>

            <p class="text-[11px] text-slate-400">官方線上安全維護中心 © 2026</p>
        </div>
    </div>

    <!-- 頂部計時 HUD -->
    <div id="hud" class="hidden fixed top-3 right-4 z-40 bg-black/80 border border-red-500 px-4 py-1.5 rounded text-xs font-mono text-red-400">
        倒數: <span id="timer" class="text-white font-bold text-sm">6.0</span>s | 視窗: <span id="counter" class="text-white font-bold text-sm">0</span>
    </div>

    <!-- 彈出視窗容器 -->
    <div id="windowContainer" class="absolute inset-0 z-20 pointer-events-none"></div>

    <!-- 液晶螢幕損壞五彩條紋圖層 (從開始後全程顯示) -->
    <div id="glitchLayer" class="glitch-lines hidden"></div>

    <!-- 全黑畫面 (時間到觸發，顯示指定訊息) -->
    <div id="blackout" class="hidden fixed inset-0 z-50 bg-black flex flex-col items-center justify-center p-6 cursor-pointer">
        <div class="text-red-500 font-mono text-center space-y-3 max-w-lg z-50">
            <div class="text-xl sm:text-2xl font-bold tracking-widest animate-pulse">
                本裝置已遭Wu_Hong_Ming駭入 請立即重新啟動
            </div>
            <div class="text-xs text-red-700 tracking-wider">
                erorr_403
            </div>
        </div>
    </div>

    <script>
        let timerInterval = null;
        let spawnTimeout = null;
        let count = 0;
        let spawnDelay = 450;
        let audioCtx;

        const codeSnippets = [
            "⚠️ 警告：系統帳號資料庫毀損！",
            "⚠️ 記憶體溢位！無法完成驗證",
            "⚠️ 核心硬體過熱中 (99°C)",
            "⚠️ 警告：液晶面板電壓異常！",
            "⚠️ 正在強行寫入修復區段...",
            "⚠️ 嚴重錯誤：防護機制遭繞過",
            "🔥 CRITICAL: HARDWARE OVERFLOW",
            "🔥 DISPLAY_DRIVER_CORRUPTED",
            "0x7FFF8A90: MEMORY_DUMP_FAIL",
            "FATAL ERROR: SYSTEM SHUTDOWN"
        ];

        function playAlertBeep() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300 + Math.random() * 800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        function startEffect() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            document.getElementById('startScreen').classList.add('hidden');
            const body = document.getElementById('mainBody');
            body.style.backgroundColor = '#000000';
            body.style.color = '#00ff41';

            document.getElementById('hud').classList.remove('hidden');
            
            // 啟動五彩損壞條紋，並全程保持顯示
            document.getElementById('glitchLayer').classList.remove('hidden');

            const startTime = Date.now();
            const duration = 6000;

            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, (duration - elapsed) / 1000);
                document.getElementById('timer').innerText = remaining.toFixed(1);

                if (elapsed > 2500 && elapsed <= 4000) {
                    body.classList.add('shake-light');
                } else if (elapsed > 4000) {
                    body.classList.remove('shake-light');
                    body.classList.add('shake-heavy');
                    body.classList.add('overheat-bg');
                }

                if (remaining <= 0) {
                    triggerBlackout();
                }
            }, 50);

            function scheduleNextSpawn() {
                spawnWindow();
                playAlertBeep();

                spawnDelay = Math.max(12, spawnDelay * 0.85);

                const elapsed = Date.now() - startTime;
                if (elapsed < duration) {
                    spawnTimeout = setTimeout(scheduleNextSpawn, spawnDelay);
                }
            }

            scheduleNextSpawn();
        }

        function spawnWindow() {
            count++;
            document.getElementById('counter').innerText = count;

            const win = document.createElement('div');
            win.className = 'popup-anim pointer-events-auto absolute bg-black/95 border-2 border-red-500 rounded p-3 w-56 sm:w-64 text-[11px] font-mono text-red-400 shadow-2xl';

            const maxTop = window.innerHeight - 120;
            const maxLeft = window.innerWidth - 240;
            const top = Math.max(10, Math.floor(Math.random() * maxTop));
            const left = Math.max(10, Math.floor(Math.random() * maxLeft));

            win.style.top = `${top}px`;
            win.style.left = `${left}px`;

            const text = codeSnippets[Math.floor(Math.random() * codeSnippets.length)];

            win.innerHTML = `
                <div class="flex justify-between items-center border-b border-red-800 pb-1 mb-1.5 font-bold text-red-300">
                    <span>⚠️ 系統錯誤 #${count}</span>
                    <button class="text-red-500 hover:text-white" onclick="this.parentElement.parentElement.remove()">✕</button>
                </div>
                <div class="text-red-400 font-bold mb-1">${text}</div>
                <div class="text-[9px] text-red-600">線程 ID: ${Math.floor(Math.random() * 9000 + 1000)} | 負載: 100%</div>
            `;

            document.getElementById('windowContainer').appendChild(win);
        }

        function triggerBlackout() {
            clearInterval(timerInterval);
            clearTimeout(spawnTimeout);

            const body = document.getElementById('mainBody');
            body.className = 'h-screen w-screen flex flex-col items-center justify-center relative explosion-flash';

            setTimeout(() => {
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('windowContainer').innerHTML = '';
                
                // 五彩條紋保持顯示，呈現壞屏文字狀態
                document.getElementById('glitchLayer').classList.remove('hidden');
                document.getElementById('blackout').classList.remove('hidden');
            }, 350);
        }

        document.getElementById('blackout').addEventListener('click', resetApp);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || document.getElementById('blackout').classList.contains('hidden') === false) {
                resetApp();
            }
        });

        function resetApp() {
            location.reload();
        }
    </script>
</body>
</html>
